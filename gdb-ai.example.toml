[server]
max_sessions = 8
max_http_sessions = 128
http_session_idle_ms = 900000
command_timeout_ms = 5000
wait_timeout_ms = 5000
write_lease_ms = 30000
# unix_socket = "/run/user/1000/gdb-ai.sock"
requests_per_second = 100
request_burst = 200

[gdb]
path = "/usr/bin/gdb"
preferred_mi = "mi4"
fallback_mi = "mi3"
# python_extension = "/usr/lib/gdb-ai/gdb_ai.py"
# python_extension_sha256 = "<64 lowercase hexadecimal digits>"

[journal]
durability = "performance"

[output]
evidence = "ephemeral_ring" # ephemeral_ring, bounded_spool, or artifact
max_bytes = 8388608

[limits]
mi_record_bytes = 8388608
mi_depth = 128
tool_response_bytes = 262144
inline_memory_bytes = 4096
memory_read_bytes = 16777216
inferior_output_ring_bytes = 8388608
console_output_ring_bytes = 2097152
stack_frames = 64
value_children = 1000
value_depth = 8
session_artifact_bytes = 536870912
total_artifact_bytes = 4294967296
journal_bytes = 67108864
process_memory_bytes = 2147483648
process_cpu_seconds = 3600
process_open_files = 1024
process_count = 0 # RLIMIT_NPROC is host-UID-wide; use a cgroup for process quotas.

[artifacts]
path = ".gdb-ai/artifacts"

[persistence]
sqlite = ".gdb-ai/gdb-ai.sqlite"
sessions = ".gdb-ai/sessions"

[security]
default_profile = "debug_control"
workspace_roots = ["."]
remote_allowlist = []
attach_allowlist = []
sandbox = "auto"
kernel_enabled = false
monitor_allowlist = []
# source_map = [{ from = "/build/src", to = "/workspace/src" }]
