[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdb-ai-sdk"
version = "0.1.0"
description = "Canonical gdb.ai/v1 client for GDB/MI"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}

[tool.setuptools.packages.find]
where = ["src"]
