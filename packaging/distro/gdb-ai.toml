[server]
max_sessions = 8
max_http_sessions = 128
http_session_idle_ms = 900000
command_timeout_ms = 15000
wait_timeout_ms = 5000
write_lease_ms = 30000
unix_socket = "/run/gdb-ai/gdb-ai.sock"
requests_per_second = 100
request_burst = 200

[gdb]
path = "/usr/bin/gdb"
preferred_mi = "mi4"
fallback_mi = "mi3"

[artifacts]
path = "/var/lib/gdb-ai/artifacts"

[persistence]
sqlite = "/var/lib/gdb-ai/gdb-ai.sqlite"
sessions = "/var/lib/gdb-ai/sessions"

[output]
evidence = "bounded_spool"
max_bytes = 8388608

[storage]
max_closed_sessions = 256
closed_session_retention_ms = 604800000
max_audit_rows = 100000
audit_retention_ms = 2592000000
max_snapshots_per_session = 256
max_operations_per_session = 4096

[limits]
session_artifact_bytes = 536870912
owner_artifact_bytes = 1073741824
total_artifact_bytes = 4294967296
journal_bytes = 67108864

[security]
default_profile = "debug_control"
workspace_roots = ["/workspace"]
remote_allowlist = []
attach_allowlist = []
environment_allowlist = []
sandbox = "auto"
