<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780"
     viewBox="0 0 1200 780" role="img" aria-labelledby="title description">
  <title id="title">GDB/AI session architecture</title>
  <desc id="description">Agent and SDK requests pass through transport
    adapters and the Gateway. Each session has one actor and one GNU GDB
    process. A separate control lane reaches the actor, GDB output is framed,
    journaled, normalized, and reduced, local target bytes use a PTY, and
    retained observations can be read from evidence storage without GDB.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#274c77"/>
    </marker>
    <marker id="arrow-both" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#274c77"/>
    </marker>
    <marker id="control-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9a5b3f"/>
    </marker>
    <marker id="io-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9a5b3f"/>
    </marker>
    <marker id="record-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#697582"/>
    </marker>
    <style>
      text { fill: #182433; font-family: Inter, "DejaVu Sans", Arial, sans-serif; }
      .title { font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
               font-size: 21px; font-weight: 600; }
      .label { fill: #596675; font-size: 16px; }
      .small { fill: #596675; font-size: 14px; }
      .pipeline { fill: #596675; font-size: 14px; }
      .boundary-label { fill: #596675; font-size: 14px; font-weight: 700;
                        letter-spacing: 2px; }
      .canvas { fill: #fffefa; stroke: #c7c2b8; stroke-width: 1.2; }
      .server { fill: #f6f7f6; stroke: #9aa3ac; stroke-width: 1.3; }
      .session { fill: #fbfaf7; stroke: #b2bbc3; stroke-width: 1.2;
                 stroke-dasharray: 7 5; }
      .box { fill: #fffefa; stroke: #8b96a1; stroke-width: 1.3; }
      .primary { fill: #eef3f7; stroke: #274c77; stroke-width: 1.5; }
      .io-box { fill: #f8f0eb; stroke: #9a5b3f; stroke-width: 1.4; }
      .request { fill: none; stroke: #274c77; stroke-width: 1.8;
                 marker-start: url(#arrow-both); marker-end: url(#arrow-both); }
      .flow { fill: none; stroke: #274c77; stroke-width: 1.8;
              marker-end: url(#arrow); }
      .control { fill: none; stroke: #9a5b3f; stroke-width: 1.8;
                 marker-end: url(#control-arrow); }
      .io { fill: none; stroke: #9a5b3f; stroke-width: 1.8;
            marker-start: url(#io-arrow); marker-end: url(#io-arrow); }
      .record { fill: none; stroke: #697582; stroke-width: 1.6;
                stroke-dasharray: 7 5; marker-end: url(#record-arrow); }
    </style>
  </defs>

  <rect class="canvas" x="1" y="1" width="1198" height="778" rx="9"/>

  <rect class="box" x="35" y="115" width="200" height="86" rx="6"/>
  <text class="title" x="135" y="150" text-anchor="middle">Agent</text>
  <text class="label" x="135" y="178" text-anchor="middle">or SDK client</text>

  <rect class="server" x="270" y="28" width="895" height="610" rx="9"/>
  <text class="boundary-label" x="300" y="59">GDB/AI SERVER</text>

  <rect class="primary" x="320" y="90" width="230" height="92" rx="6"/>
  <text class="title" x="435" y="121" text-anchor="middle">Transport adapters</text>
  <text class="label" x="435" y="148" text-anchor="middle">MCP stdio · Unix · HTTP</text>
  <text class="small" x="435" y="169" text-anchor="middle">canonical JSON-RPC</text>

  <rect class="primary" x="610" y="90" width="250" height="92" rx="6"/>
  <text class="title" x="735" y="121" text-anchor="middle">Gateway</text>
  <text class="label" x="735" y="148" text-anchor="middle">validation · policy · ownership</text>
  <text class="small" x="735" y="169" text-anchor="middle">locks · audit · operation registry</text>

  <rect class="box" x="920" y="90" width="195" height="92" rx="6"/>
  <text class="title" x="1018" y="121" text-anchor="middle">Evidence stores</text>
  <text class="label" x="1018" y="148" text-anchor="middle">journal · SQLite</text>
  <text class="small" x="1018" y="169" text-anchor="middle">content-addressed artifacts</text>

  <path class="request" d="M235 158 H320"/>
  <path class="request" d="M550 136 H610"/>
  <path class="request" d="M860 136 H920"/>
  <text class="small" x="890" y="125" text-anchor="middle">history</text>

  <rect class="session" x="320" y="245" width="795" height="320" rx="7"/>
  <text class="boundary-label" x="348" y="275">ONE SESSION RUNTIME</text>

  <rect class="box" x="365" y="315" width="185" height="78" rx="5"/>
  <text class="title" x="458" y="347" text-anchor="middle">Operation</text>
  <text class="label" x="458" y="374" text-anchor="middle">normal lane</text>

  <rect class="primary" x="610" y="293" width="260" height="120" rx="6"/>
  <text class="title" x="740" y="324" text-anchor="middle">Session actor</text>
  <text class="label" x="740" y="350" text-anchor="middle">one per session</text>
  <text class="small" x="740" y="374" text-anchor="middle">sole MI writer</text>
  <text class="small" x="740" y="396" text-anchor="middle">raw/domain journal · reducer</text>

  <rect class="box" x="930" y="315" width="145" height="78" rx="5"/>
  <text class="title" x="1003" y="347" text-anchor="middle">GNU GDB</text>
  <text class="label" x="1003" y="374" text-anchor="middle">one process</text>

  <rect class="io-box" x="365" y="455" width="185" height="70" rx="5"/>
  <text class="title" x="458" y="484" text-anchor="middle">Local PTY</text>
  <text class="small" x="458" y="508" text-anchor="middle">input · bounded output</text>

  <rect class="box" x="600" y="455" width="320" height="60" rx="5"/>
  <text class="pipeline" x="760" y="490" text-anchor="middle">stdout → framer/parser → bounded queue</text>

  <path class="flow" d="M680 182 V222 H458 V315"/>
  <text class="small" x="532" y="213" text-anchor="middle">typed dispatch</text>
  <path class="flow" d="M550 354 H610"/>

  <path class="control" d="M790 182 V246 H800 V293"/>
  <text class="small" x="932" y="274" text-anchor="middle">interrupt · close control lane</text>

  <path class="flow" d="M870 330 H930"/>
  <path class="flow" d="M1003 393 V485 H920"/>
  <path class="flow" d="M760 455 V413"/>

  <path class="record" d="M835 293 V220 H1018 V182"/>

  <rect class="box" x="910" y="690" width="205" height="65" rx="5"/>
  <text class="title" x="1013" y="718" text-anchor="middle">Target or core</text>
  <text class="label" x="1013" y="742" text-anchor="middle">local · remote · core file</text>

  <path class="request" d="M1013 393 V690"/>
  <text class="small" x="1030" y="610">native · RSP · file</text>
  <path class="io" d="M910 723 H585 V490 H550"/>
  <text class="small" x="730" y="710" text-anchor="middle">local target bytes</text>
</svg>
