<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850"
     viewBox="0 0 1200 850" role="img" aria-labelledby="title description">
  <title id="title">GDB/AI architecture and session ownership</title>
  <desc id="description">The gdb-ai executable handles CLI and transports;
    gdb-ai-core owns the Gateway, session actors, live state, and evidence;
    gdb-ai-mi supplies the lossless MI codec. Each session has one actor and
    one GNU GDB child process. Normal requests and interrupt or close control
    reach the actor through separate lanes. The actor alone writes MI and
    owns the reducer. GDB stdout is framed and parsed before reduction.
    Local target PTY bytes drain independently into a bounded ring or spool;
    the actor receives output metadata and handles input. Recorded history
    may lag live state. Remote targets and core files use GDB, not the local
    PTY. Arrows show dependencies and data paths, not a shared clock.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5"
            orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#42617b"/>
    </marker>
    <marker id="record-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5"
            orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#7d8e9e"/>
    </marker>
    <style>
      text { fill: #233647; font-family: "DejaVu Sans", Arial, sans-serif; }
      .heading { font-family: "DejaVu Serif", Georgia, serif; font-size: 27px; }
      .title { font-family: "DejaVu Serif", Georgia, serif; font-size: 22px; }
      .body { fill: #526575; font-size: 17px; }
      .small { fill: #607382; font-size: 14.5px; }
      .crate { fill: #42617b; font-family: "DejaVu Sans Mono", monospace; font-size: 15px; }
      .section { fill: #607382; font-size: 13px; font-weight: 600; letter-spacing: 1.3px; }
      .card { fill: #ffffff; stroke: #c7d3de; stroke-width: 1.2; }
      .accent { fill: #f4f7fa; stroke: #9db1c3; stroke-width: 1.2; }
      .session { fill: #fafbfd; stroke: #c7d3de; stroke-width: 1.2; stroke-dasharray: 6 5; }
      .flow { fill: none; stroke: #42617b; stroke-width: 1.7; marker-end: url(#arrow); }
      .both { fill: none; stroke: #42617b; stroke-width: 1.7; marker-start: url(#arrow); marker-end: url(#arrow); }
      .control { fill: none; stroke: #42617b; stroke-width: 1.7; stroke-dasharray: 3 4; marker-end: url(#arrow); }
      .record { fill: none; stroke: #7d8e9e; stroke-width: 1.6; stroke-dasharray: 7 5; marker-end: url(#record-arrow); }
    </style>
  </defs>

  <rect width="1200" height="850" fill="#ffffff"/>
  <text class="heading" x="44" y="51">Architecture and session ownership</text>
  <text class="body" x="44" y="81">Three Rust crates; one actor and one GDB process per session</text>

  <rect class="card" x="44" y="132" width="145" height="90" rx="4"/>
  <text class="title" x="116.5" y="169" text-anchor="middle">Agent</text>
  <text class="body" x="116.5" y="197" text-anchor="middle">or SDK client</text>

  <rect class="accent" x="250" y="114" width="220" height="128" rx="4"/>
  <text class="crate" x="270" y="140">gdb-ai</text>
  <text class="title" x="360" y="175" text-anchor="middle">CLI &amp; transports</text>
  <text class="body" x="360" y="202" text-anchor="middle">stdio · Unix · HTTP</text>
  <text class="body" x="360" y="226" text-anchor="middle">MCP · JSON-RPC</text>

  <rect class="accent" x="540" y="114" width="260" height="128" rx="4"/>
  <text class="crate" x="560" y="140">gdb-ai-core</text>
  <text class="title" x="670" y="175" text-anchor="middle">Gateway</text>
  <text class="body" x="670" y="202" text-anchor="middle">validation · ownership</text>
  <text class="small" x="670" y="226" text-anchor="middle">policy · scheduling · operations</text>

  <rect class="card" x="885" y="114" width="240" height="128" rx="4"/>
  <text class="title" x="1005" y="150" text-anchor="middle">Recorded evidence</text>
  <text class="body" x="1005" y="179" text-anchor="middle">journal · SQLite · artifacts</text>
  <text class="small" x="1005" y="204" text-anchor="middle">retained observations</text>
  <text class="small" x="1005" y="226" text-anchor="middle">history may lag live state</text>

  <path class="both" d="M189 177 H250"/>
  <path class="both" d="M470 177 H540"/>
  <path class="both" d="M800 177 H885"/>
  <text class="small" x="842.5" y="160" text-anchor="middle">history</text>

  <rect class="session" x="250" y="310" width="900" height="360" rx="5"/>
  <text class="section" x="276" y="339">ONE SESSION</text>
  <text class="small" x="276" y="364">Repeated independently</text>

  <rect class="accent" x="540" y="345" width="260" height="120" rx="4"/>
  <text class="crate" x="560" y="370">gdb-ai-core</text>
  <text class="title" x="670" y="402" text-anchor="middle">Session actor</text>
  <text class="small" x="670" y="432" text-anchor="middle">sole MI writer · reducer owner</text>

  <rect class="card" x="885" y="345" width="240" height="120" rx="4"/>
  <text class="title" x="1005" y="385" text-anchor="middle">GNU GDB</text>
  <text class="body" x="1005" y="414" text-anchor="middle">one child process</text>
  <text class="small" x="1005" y="438" text-anchor="middle">native debugger backend</text>

  <path class="flow" d="M590 242 V345"/>
  <text class="small" x="571" y="285" text-anchor="end">normal lane</text>
  <path class="control" d="M735 242 V345"/>
  <text class="small" x="719" y="285" text-anchor="end">interrupt · close</text>
  <path class="record" d="M780 345 V270 H1005 V242"/>
  <text class="small" x="925" y="260" text-anchor="middle">recorded evidence</text>
  <path class="flow" d="M800 390 H885"/>
  <text class="small" x="842.5" y="377" text-anchor="middle">MI commands</text>

  <rect class="card" x="280" y="530" width="220" height="98" rx="4"/>
  <text class="title" x="390" y="563" text-anchor="middle">Local PTY</text>
  <text class="body" x="390" y="588" text-anchor="middle">reader → ring / spool</text>
  <text class="small" x="390" y="612" text-anchor="middle">bounded byte stream</text>

  <rect class="accent" x="540" y="530" width="260" height="98" rx="4"/>
  <text class="title" x="670" y="565" text-anchor="middle">Live session state</text>
  <text class="small" x="670" y="593" text-anchor="middle">watched revision · stop · epoch</text>

  <rect class="accent" x="885" y="530" width="240" height="98" rx="4"/>
  <text class="crate" x="905" y="555">gdb-ai-mi</text>
  <text class="title" x="1005" y="584" text-anchor="middle">MI codec</text>
  <text class="small" x="1005" y="611" text-anchor="middle">framer · parser · encoder</text>

  <path class="flow" d="M670 465 V530"/>
  <text class="small" x="688" y="503">reduce</text>
  <path class="flow" d="M1005 465 V530"/>
  <text class="small" x="1023" y="503">stdout</text>
  <path class="flow" d="M885 580 H845 V435 H800"/>
  <text class="small" x="831" y="515" text-anchor="end">parsed records</text>
  <path class="both" d="M570 465 V498 H390 V530"/>
  <text class="small" x="433" y="488" text-anchor="middle">input / output metadata</text>
  <path class="flow" d="M280 580 H230 V269 H550 V242"/>
  <text class="small" x="370" y="258" text-anchor="middle">output reads</text>

  <!-- 2026-10-08: Only local inferiors use the PTY; remote/core access stays with GDB. -->
  <rect class="card" x="885" y="714" width="240" height="82" rx="4"/>
  <text class="title" x="1005" y="748" text-anchor="middle">Debugging target</text>
  <text class="body" x="1005" y="776" text-anchor="middle">local · remote · core</text>
  <path class="both" d="M390 628 V755 H885"/>
  <text class="body" x="630" y="740" text-anchor="middle">local target bytes</text>
  <path class="both" d="M1125 390 H1160 V755 H1125"/>
  <text class="small" x="1177" y="576" text-anchor="middle"
        transform="rotate(-90 1177 576)">native · RSP · core file</text>

  <path d="M44 809 H1156" fill="none" stroke="#e0e7ed" stroke-width="1"/>
  <text class="small" x="44" y="835">Solid: request and data paths</text>
  <text class="small" x="410" y="835">Dashed: control lane and recorded evidence</text>
  <text class="small" x="1156" y="835" text-anchor="end">No shared MI / PTY clock</text>
</svg>
