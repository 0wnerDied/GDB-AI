<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="930"
     viewBox="0 0 1120 930" role="img" aria-labelledby="title description">
  <title id="title">GDB/AI: session ownership and data paths</title>
  <desc id="description">Agent clients reach a shared MCP or canonical JSON-RPC
    interface and Gateway. Each session actor owns live state and a dedicated
    GDB process. The local inferior exchanges bytes through a separate PTY
    capture path. History and artifacts are recorded separately; performance
    mode reports history gaps, while durable mode requires evidence writes.
    GDB also supports attached processes, core files, and remote RSP targets.
    Solid arrows represent live interaction; dashed arrows represent recording.</desc>
  <!-- 2026-09-05: The old figure made leases and durable evidence universal.
       Show caller control, actor-owned live state, and mode-dependent history. -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#315d8a"/>
    </marker>
    <marker id="io-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#236955"/>
    </marker>
    <marker id="record-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#687281"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #172231; }
      .title { font-size: 24px; font-weight: 700; }
      .body { font-size: 19px; }
      .note { font-size: 17px; fill: #465366; }
      .box { fill: #fff; stroke: #728195; stroke-width: 1.6; }
      .live { fill: #eff5fb; stroke: #537ca5; stroke-width: 1.6; }
      .io-box { fill: #edf6f2; stroke: #397761; stroke-width: 1.6; }
      .flow { fill: none; stroke: #315d8a; stroke-width: 2;
              marker-end: url(#arrow); }
      .io { fill: none; stroke: #236955; stroke-width: 2;
            marker-end: url(#io-arrow); }
      .record { fill: none; stroke: #687281; stroke-width: 2;
                stroke-dasharray: 6 5; marker-end: url(#record-arrow); }
    </style>
  </defs>
  <rect width="1120" height="930" fill="#fff"/>

  <rect class="box" x="36" y="36" width="1048" height="90" rx="6"/>
  <text class="title" x="560" y="72" text-anchor="middle">Agent clients</text>
  <text class="body" x="560" y="105" text-anchor="middle">MCP clients · Python / TypeScript SDKs</text>

  <rect x="36" y="166" width="1048" height="468" rx="8"
        fill="#f8fafc" stroke="#728195" stroke-width="1.6"/>
  <text class="title" x="64" y="195">GDB/AI server</text>
  <rect class="live" x="64" y="218" width="992" height="66" rx="5"/>
  <text class="title" x="560" y="245" text-anchor="middle">MCP tools / canonical JSON-RPC</text>
  <text class="body" x="560" y="271" text-anchor="middle">stdio · Unix socket · loopback HTTP</text>
  <path class="flow" d="M560 126 V218"/>
  <path class="flow" d="M560 218 V126"/>

  <rect class="live" x="64" y="320" width="570" height="82" rx="5"/>
  <text class="title" x="349" y="353" text-anchor="middle">Gateway and operations</text>
  <text class="body" x="349" y="382" text-anchor="middle">Caller control · context checks · coordination</text>
  <path class="flow" d="M349 284 V320"/>
  <path class="flow" d="M349 320 V284"/>

  <rect class="live" x="64" y="442" width="570" height="138" rx="5"/>
  <text class="title" x="349" y="476" text-anchor="middle">Session actor</text>
  <text class="body" x="349" y="508" text-anchor="middle">MI command queue · interrupt / close lane</text>
  <text class="body" x="349" y="536" text-anchor="middle">Live state · stop IDs · execution epochs</text>
  <text class="note" x="349" y="561" text-anchor="middle">One actor and one GDB process per session</text>
  <path class="flow" d="M349 402 V442"/>
  <path class="flow" d="M349 442 V402"/>

  <rect class="box" x="746" y="320" width="310" height="204" rx="5"/>
  <text class="title" x="901" y="353" text-anchor="middle">History / artifacts</text>
  <text class="body" x="901" y="386" text-anchor="middle">JSONL · SQLite · artifacts</text>
  <text class="body" x="901" y="423" text-anchor="middle">Performance (default):</text>
  <text class="body" x="901" y="449" text-anchor="middle">history gaps are reported</text>
  <text class="body" x="901" y="490" text-anchor="middle">Durable: writes required</text>
  <path class="record" d="M634 477 H746"/>
  <text class="note" x="690" y="463" text-anchor="middle">record</text>

  <rect class="io-box" x="746" y="558" width="310" height="64" rx="5"/>
  <text class="title" x="901" y="585" text-anchor="middle">PTY capture</text>
  <text class="note" x="901" y="610" text-anchor="middle">Bounded bytes / optional spool</text>
  <path class="io" d="M634 545 H690 V590 H746"/>
  <path class="io" d="M746 590 H690 V545 H634"/>

  <rect class="live" x="64" y="704" width="570" height="70" rx="5"/>
  <text class="title" x="349" y="733" text-anchor="middle">GNU GDB</text>
  <text class="body" x="349" y="760" text-anchor="middle">Target control · symbols · unwinding · JIT</text>
  <path class="flow" d="M349 580 V704"/>
  <path class="flow" d="M349 704 V580"/>
  <text class="body" x="374" y="675">GDB/MI 3 or 4</text>

  <rect class="io-box" x="746" y="704" width="310" height="70" rx="5"/>
  <text class="title" x="901" y="733" text-anchor="middle">Launched inferior</text>
  <text class="note" x="901" y="760" text-anchor="middle">stdin / stdout / stderr</text>
  <path class="io" d="M901 622 V704"/>
  <path class="io" d="M901 704 V622"/>
  <text class="body" x="925" y="675">PTY</text>
  <path class="flow" d="M634 739 H746"/>
  <path class="flow" d="M746 739 H634"/>
  <text class="note" x="690" y="724" text-anchor="middle">control</text>

  <rect class="box" x="64" y="830" width="992" height="58" rx="5"/>
  <text class="body" x="560" y="865" text-anchor="middle">Other targets: PID attach · core files · gdbserver / QEMU RSP</text>
  <path class="flow" d="M349 774 V830"/>
  <path class="flow" d="M349 830 V774"/>
  <text class="note" x="374" y="812">Target access</text>
  <text class="note" x="560" y="918" text-anchor="middle">Solid: live interaction · dashed: recording · PTY path: local launches</text>
</svg>
