<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="970"
     viewBox="0 0 1120 970" role="img" aria-labelledby="title description">
  <title id="title">GDB/AI: one continue-and-inspect request</title>
  <desc id="description">Illustrative successful MCP continue operation with
    a breakpoint hit. GDB/AI issues an MI command. GDB resumes the target and
    sends a command result and asynchronous running/stopped records. Local
    inferior output reaches independent PTY capture. Requested stack and
    register observations are checked against the stop context and returned
    with bounded output in one Agent response. This is not a timing diagram;
    it does not impose an ordering between independent MI and PTY streams.</desc>
  <!-- 2026-09-05: The old sequence used a nonexistent execution.continue
       method and required leases and persistence on the MCP response path.
       Show gdb_run, stop-bound inspection, and independent PTY traffic. -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#315d8a"/>
    </marker>
    <marker id="event-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#465366"/>
    </marker>
    <marker id="io-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#236955"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #172231; }
      .title { font-size: 23px; font-weight: 700; }
      .label { font-size: 18px; }
      .note { font-size: 17px; fill: #465366; }
      .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 17px; }
      .box { fill: #eff5fb; stroke: #728195; stroke-width: 1.6; }
      .life { stroke: #aab2be; stroke-width: 1.3; stroke-dasharray: 5 5; }
      .flow { fill: none; stroke: #315d8a; stroke-width: 2;
              marker-end: url(#arrow); }
      .event { fill: none; stroke: #465366; stroke-width: 2;
               stroke-dasharray: 7 5; marker-end: url(#event-arrow); }
      .io { fill: none; stroke: #236955; stroke-width: 2;
            marker-end: url(#io-arrow); }
    </style>
  </defs>
  <rect width="1120" height="970" fill="#fff"/>

  <rect class="box" x="40" y="40" width="220" height="66" rx="5"/>
  <text class="title" x="150" y="81" text-anchor="middle">Agent</text>
  <rect class="box" x="310" y="40" width="220" height="66" rx="5"/>
  <text class="title" x="420" y="81" text-anchor="middle">GDB/AI</text>
  <rect class="box" x="590" y="40" width="220" height="66" rx="5"/>
  <text class="title" x="700" y="81" text-anchor="middle">GNU GDB</text>
  <rect class="box" x="870" y="40" width="220" height="66" rx="5"/>
  <text class="title" x="980" y="81" text-anchor="middle">Local inferior</text>

  <path class="life" d="M150 106 V880 M420 106 V880 M700 106 V880 M980 106 V880"/>
  <rect x="413" y="169" width="14" height="686" fill="#e9eff6" stroke="#728195"/>

  <path class="flow" d="M150 170 H413"/>
  <text class="label" x="282" y="147" text-anchor="middle">gdb_run: continue</text>
  <text class="note" x="282" y="194" text-anchor="middle">session + requested views</text>

  <rect class="box" x="310" y="215" width="360" height="42" rx="4"/>
  <text class="note" x="490" y="242" text-anchor="middle">Validate caller and stop context</text>
  <path class="flow" d="M427 295 H700"/>
  <text class="mono" x="563" y="283" text-anchor="middle">42-exec-continue</text>

  <path class="flow" d="M700 338 H980"/>
  <text class="label" x="840" y="324" text-anchor="middle">Resume execution</text>

  <path class="flow" d="M700 388 H427"/>
  <text class="mono" x="563" y="374" text-anchor="middle">42^running</text>
  <text class="note" x="760" y="395">Command result</text>
  <path class="event" d="M700 443 H427"/>
  <text class="mono" x="563" y="429" text-anchor="middle">*running</text>
  <text class="note" x="760" y="450">State event</text>

  <rect class="box" x="310" y="468" width="470" height="44" rx="4"/>
  <text class="note" x="545" y="496" text-anchor="middle">Advance epoch; invalidate old stop handles</text>

  <path class="io" d="M980 558 H427"/>
  <text class="label" x="704" y="540" text-anchor="middle">PTY output to bounded capture</text>

  <path class="event" d="M700 617 H427"/>
  <text class="mono" x="563" y="600" text-anchor="middle">*stopped</text>
  <text class="note" x="760" y="624">Breakpoint hit</text>

  <path class="flow" d="M427 678 H700"/>
  <text class="label" x="563" y="662" text-anchor="middle">Stack / register queries</text>
  <path class="flow" d="M700 732 H427"/>
  <text class="label" x="563" y="716" text-anchor="middle">MI replies</text>

  <rect class="box" x="310" y="758" width="470" height="44" rx="4"/>
  <text class="note" x="545" y="786" text-anchor="middle">Verify stop ID and execution epoch</text>

  <path class="flow" d="M413 855 H150"/>
  <text class="label" x="282" y="835" text-anchor="middle">Stop + views + output</text>
  <text class="note" x="282" y="879" text-anchor="middle">One bounded MCP response</text>

  <text class="note" x="560" y="920" text-anchor="middle">Illustrative order; MI and PTY are independent streams. Time is not to scale.</text>
  <text class="note" x="560" y="948" text-anchor="middle">Solid blue: command / reply · dashed: state event · green: target bytes</text>
</svg>
