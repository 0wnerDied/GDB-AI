<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820"
     viewBox="0 0 1600 820" role="img"
     aria-labelledby="title description">
  <title id="title">GDB/AI execution operation sequence</title>
  <desc id="description">
    Paper-style sequence diagram showing a semantic continue request, policy
    validation, a tokenized GDB/MI command, separate result and asynchronous
    running records, inferior output, a stopped event, state reduction,
    snapshot evidence, and the bounded response returned to the Agent.
  </desc>

  <defs>
    <marker id="seq-blue" markerWidth="10" markerHeight="10" refX="9"
            refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315d8a"/>
    </marker>
    <marker id="seq-orange" markerWidth="10" markerHeight="10" refX="9"
            refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b46a2b"/>
    </marker>
    <marker id="seq-green" markerWidth="10" markerHeight="10" refX="9"
            refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3f7c68"/>
    </marker>
    <marker id="seq-gray" markerWidth="10" markerHeight="10" refX="9"
            refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .actor { fill: #f8fafc; stroke: #66768a; stroke-width: 1.5; }
      .actor-title { font-size: 16px; font-weight: 700; }
      .life { stroke: #9ba6b3; stroke-width: 1.3; stroke-dasharray: 5 5; }
      .activation { fill: #e8eef5; stroke: #708197; stroke-width: 1; }
      .blue { stroke: #315d8a; stroke-width: 2; fill: none;
              marker-end: url(#seq-blue); }
      .orange { stroke: #b46a2b; stroke-width: 2; fill: none;
                stroke-dasharray: 7 4; marker-end: url(#seq-orange); }
      .green { stroke: #3f7c68; stroke-width: 2.2; fill: none;
               marker-end: url(#seq-green); }
      .gray { stroke: #6b7280; stroke-width: 1.8; fill: none;
              stroke-dasharray: 3 4; marker-end: url(#seq-gray); }
      .label { font-size: 13px; }
      .small { font-size: 12px; fill: #536174; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; }
      .step { fill: #ffffff; stroke: #8c98a7; stroke-width: 1; }
      .step-text { font-size: 11px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="820" fill="#ffffff"/>

  <!-- Participants. -->
  <rect class="actor" x="45" y="35" width="190" height="58" rx="5"/>
  <text class="actor-title" x="140" y="69" text-anchor="middle">Agent</text>
  <rect class="actor" x="305" y="35" width="190" height="58" rx="5"/>
  <text class="actor-title" x="400" y="69" text-anchor="middle">Gateway</text>
  <rect class="actor" x="565" y="35" width="190" height="58" rx="5"/>
  <text class="actor-title" x="660" y="69" text-anchor="middle">Session actor</text>
  <rect class="actor" x="825" y="35" width="190" height="58" rx="5"/>
  <text class="actor-title" x="920" y="69" text-anchor="middle">GNU GDB / MI</text>
  <rect class="actor" x="1085" y="35" width="190" height="58" rx="5"/>
  <text class="actor-title" x="1180" y="69" text-anchor="middle">Inferior + PTY</text>
  <rect class="actor" x="1345" y="35" width="210" height="58" rx="5"/>
  <text class="actor-title" x="1450" y="69" text-anchor="middle">Evidence store</text>

  <line class="life" x1="140" y1="93" x2="140" y2="775"/>
  <line class="life" x1="400" y1="93" x2="400" y2="775"/>
  <line class="life" x1="660" y1="93" x2="660" y2="775"/>
  <line class="life" x1="920" y1="93" x2="920" y2="775"/>
  <line class="life" x1="1180" y1="93" x2="1180" y2="775"/>
  <line class="life" x1="1450" y1="93" x2="1450" y2="775"/>

  <rect class="activation" x="390" y="142" width="20" height="545"/>
  <rect class="activation" x="650" y="218" width="20" height="469"/>
  <rect class="activation" x="910" y="272" width="20" height="310"/>

  <!-- Numbered operation sequence. -->
  <circle class="step" cx="163" cy="135" r="13"/>
  <text class="step-text" x="163" y="139" text-anchor="middle">1</text>
  <path class="blue" d="M140 150 L390 150"/>
  <text class="label" x="265" y="137" text-anchor="middle">execution.continue</text>
  <text class="small" x="265" y="169" text-anchor="middle">session · lease · expected revision · wait policy</text>

  <circle class="step" cx="423" cy="195" r="13"/>
  <text class="step-text" x="423" y="199" text-anchor="middle">2</text>
  <path class="blue" d="M410 210 C500 210 500 235 650 235"/>
  <text class="label" x="530" y="199" text-anchor="middle">validated semantic operation</text>
  <text class="small" x="530" y="219" text-anchor="middle">schema · policy · lease · revision</text>

  <circle class="step" cx="683" cy="255" r="13"/>
  <text class="step-text" x="683" y="259" text-anchor="middle">3</text>
  <path class="blue" d="M670 275 L910 275"/>
  <text class="mono" x="790" y="263" text-anchor="middle">42-exec-continue</text>

  <rect x="700" y="300" width="440" height="82" rx="5"
        fill="#eef5fb" stroke="#8aa8c4"/>
  <text class="label" x="920" y="323" text-anchor="middle" font-weight="700">
    Command acceptance is not a target-state transition
  </text>
  <text class="small" x="920" y="346" text-anchor="middle">
    The tokenized result completes the MI request; only async records
  </text>
  <text class="small" x="920" y="365" text-anchor="middle">
    drive RUNNING / STOPPED state in the reducer.
  </text>

  <circle class="step" cx="887" cy="405" r="13"/>
  <text class="step-text" x="887" y="409" text-anchor="middle">4</text>
  <path class="blue" d="M910 420 L670 420"/>
  <text class="mono" x="790" y="408" text-anchor="middle">42^running</text>
  <text class="small" x="790" y="438" text-anchor="middle">command accepted</text>

  <circle class="step" cx="887" cy="465" r="13"/>
  <text class="step-text" x="887" y="469" text-anchor="middle">5</text>
  <path class="orange" d="M910 480 L670 480"/>
  <text class="mono" x="790" y="468" text-anchor="middle">*running,thread-id="all"</text>
  <text class="small" x="790" y="498" text-anchor="middle">epoch++ · invalidate stop-scoped handles</text>

  <path class="blue" d="M930 510 L1170 510"/>
  <text class="small" x="1050" y="498" text-anchor="middle">resume target</text>

  <circle class="step" cx="1203" cy="535" r="13"/>
  <text class="step-text" x="1203" y="539" text-anchor="middle">6</text>
  <path class="green" d="M1190 550 L1440 550"/>
  <text class="label" x="1315" y="538" text-anchor="middle">stdout / stderr bytes</text>
  <text class="small" x="1315" y="568" text-anchor="middle">separate bounded ring / spool</text>

  <circle class="step" cx="887" cy="595" r="13"/>
  <text class="step-text" x="887" y="599" text-anchor="middle">7</text>
  <path class="orange" d="M910 610 L670 610"/>
  <text class="mono" x="790" y="598" text-anchor="middle">*stopped,reason=…,frame=…</text>

  <circle class="step" cx="683" cy="635" r="13"/>
  <text class="step-text" x="683" y="639" text-anchor="middle">8</text>
  <path class="gray" d="M670 650 L1440 650"/>
  <text class="label" x="1055" y="638" text-anchor="middle">journal raw record → reduce → store minimal snapshot</text>

  <rect x="700" y="675" width="530" height="58" rx="5"
        fill="#fff6ec" stroke="#c99a6c"/>
  <text class="small" x="965" y="698" text-anchor="middle">
    New stop ID binds frame, value, memory, and snapshot evidence
  </text>
  <text class="small" x="965" y="717" text-anchor="middle">
    to one execution epoch; stale contexts fail explicitly.
  </text>

  <circle class="step" cx="637" cy="750" r="13"/>
  <text class="step-text" x="637" y="754" text-anchor="middle">9</text>
  <path class="blue" d="M650 765 C500 765 500 745 410 745"/>
  <path class="blue" d="M390 745 L150 745"/>
  <text class="label" x="400" y="733" text-anchor="middle">bounded response</text>
  <text class="small" x="400" y="783" text-anchor="middle">
    revision · stop ID · target state · evidence references
  </text>

  <!-- Legend. -->
  <line class="blue" x1="80" y1="800" x2="140" y2="800"/>
  <text class="small" x="150" y="805">request / result</text>
  <line class="orange" x1="310" y1="800" x2="370" y2="800"/>
  <text class="small" x="380" y="805">async state event</text>
  <line class="green" x1="570" y1="800" x2="630" y2="800"/>
  <text class="small" x="640" y="805">inferior I/O</text>
  <line class="gray" x1="780" y1="800" x2="840" y2="800"/>
  <text class="small" x="850" y="805">evidence / persistence</text>
</svg>
