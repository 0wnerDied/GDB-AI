<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770"
     viewBox="0 0 1200 770" role="img" aria-labelledby="title description">
  <title id="title">GDB/AI fused launch and inspection sequence</title>
  <desc id="description">An Agent sends one launch request with optional
    breakpoints and an inspection plan. GDB/AI configures and runs GNU GDB,
    local PTY bytes arrive independently, GDB reports a stop, GDB/AI binds its
    stop ID and execution epoch, performs bounded inspection, records an
    immutable observation, and returns context, results, completeness, and
    output.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#274c77"/>
    </marker>
    <marker id="event-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#697582"/>
    </marker>
    <marker id="io-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9a5b3f"/>
    </marker>
    <style>
      text { fill: #182433; font-family: Inter, "DejaVu Sans", Arial, sans-serif; }
      .title { font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
               font-size: 22px; font-weight: 600; }
      .label { font-size: 16px; }
      .small { fill: #596675; font-size: 14px; }
      .canvas { fill: #fffefa; stroke: #c7c2b8; stroke-width: 1.2; }
      .participant { fill: #f6f7f6; stroke: #8b96a1; stroke-width: 1.3; }
      .interface { fill: #eef3f7; stroke: #274c77; stroke-width: 1.5; }
      .store { fill: #fbfaf7; stroke: #697582; stroke-width: 1.3; }
      .life { stroke: #aab2ba; stroke-width: 1.2; stroke-dasharray: 5 6; }
      .flow { fill: none; stroke: #274c77; stroke-width: 1.8;
              marker-end: url(#arrow); }
      .event { fill: none; stroke: #697582; stroke-width: 1.7;
               stroke-dasharray: 7 5; marker-end: url(#event-arrow); }
      .io { fill: none; stroke: #9a5b3f; stroke-width: 1.8;
            marker-end: url(#io-arrow); }
    </style>
  </defs>

  <rect class="canvas" x="1" y="1" width="1198" height="768" rx="9"/>

  <rect class="participant" x="30" y="25" width="160" height="58" rx="5"/>
  <text class="title" x="110" y="62" text-anchor="middle">Agent</text>
  <rect class="interface" x="270" y="25" width="160" height="58" rx="5"/>
  <text class="title" x="350" y="62" text-anchor="middle">GDB/AI</text>
  <rect class="participant" x="520" y="25" width="160" height="58" rx="5"/>
  <text class="title" x="600" y="62" text-anchor="middle">GNU GDB</text>
  <rect class="participant" x="760" y="25" width="180" height="58" rx="5"/>
  <text class="title" x="850" y="62" text-anchor="middle">Local target</text>
  <rect class="store" x="1010" y="25" width="160" height="58" rx="5"/>
  <text class="title" x="1090" y="62" text-anchor="middle">Evidence</text>

  <path class="life" d="M110 83 V740 M350 83 V740 M600 83 V740 M850 83 V740 M1090 83 V740"/>

  <path class="flow" d="M110 145 H350"/>
  <text class="label" x="230" y="119" text-anchor="middle">launch · breakpoints · inspect</text>
  <text class="small" x="230" y="138" text-anchor="middle">session_id optional</text>

  <path class="flow" d="M350 220 H600"/>
  <text class="label" x="475" y="205" text-anchor="middle">configure · insert · run</text>

  <path class="flow" d="M600 295 H850"/>
  <text class="label" x="725" y="280" text-anchor="middle">launch / resume</text>

  <path class="io" d="M850 370 H350"/>
  <text class="label" x="600" y="354" text-anchor="middle">PTY bytes</text>
  <text class="small" x="600" y="390" text-anchor="middle">independent of MI state</text>

  <path class="event" d="M600 445 H350"/>
  <text class="label" x="475" y="429" text-anchor="middle">MI *stopped</text>
  <text class="small" x="475" y="466" text-anchor="middle">GDB/AI binds stop ID · epoch</text>

  <path class="flow" d="M350 520 H600"/>
  <text class="label" x="475" y="504" text-anchor="middle">bounded inspection plan</text>

  <path class="flow" d="M600 590 H350"/>
  <text class="label" x="475" y="574" text-anchor="middle">MI result records</text>

  <path class="event" d="M350 655 H1090"/>
  <text class="label" x="720" y="639" text-anchor="middle">commit immutable observation</text>

  <path class="flow" d="M350 720 H110"/>
  <text class="label" x="230" y="696" text-anchor="middle">state · observation</text>
  <text class="small" x="230" y="714" text-anchor="middle">completeness · output</text>
</svg>
