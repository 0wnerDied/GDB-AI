<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="280"
     viewBox="0 0 1120 280" role="img" aria-labelledby="title description">
  <title id="title">GDB/AI, the GDB Agent Interface</title>
  <desc id="description">A closed debugging loop. An Agent turns a hypothesis
    into a bounded GDB/AI operation. GNU GDB applies it to target state, and
    GDB/AI returns stop-bound evidence for the Agent's next hypothesis.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#274c77"/>
    </marker>
    <marker id="return-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9a5b3f"/>
    </marker>
    <style>
      text { fill: #182433; font-family: Inter, "DejaVu Sans", Arial, sans-serif; }
      .kicker { fill: #596675; font-size: 14px; font-weight: 700; letter-spacing: 2.4px; }
      .heading { font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
                 font-size: 31px; font-weight: 600; }
      .node-title { font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
                    font-size: 23px; font-weight: 600; }
      .node-note { fill: #596675; font-size: 15px; }
      .symbol { fill: #274c77; font-family: "DejaVu Sans Mono", monospace;
                font-size: 14px; font-weight: 700; }
      .panel { fill: #fffefa; stroke: #c7c2b8; stroke-width: 1.2; }
      .interface { fill: #eef3f7; stroke: #274c77; stroke-width: 1.6; }
      .node { fill: #fbfaf7; stroke: #8b96a1; stroke-width: 1.3; }
      .flow { fill: none; stroke: #274c77; stroke-width: 1.8;
              marker-end: url(#arrow); }
      .return { fill: none; stroke: #9a5b3f; stroke-width: 1.8;
                marker-end: url(#return-arrow); }
    </style>
  </defs>

  <rect class="panel" x="1" y="1" width="1118" height="278" rx="8"/>
  <text class="kicker" x="560" y="29" text-anchor="middle">GDB/AI · AGENT INTERFACE</text>
  <text class="heading" x="560" y="61" text-anchor="middle">A stateful debugging loop over GNU GDB</text>

  <rect class="node" x="48" y="84" width="220" height="76" rx="5"/>
  <text class="node-title" x="158" y="114" text-anchor="middle">Agent</text>
  <text class="node-note" x="158" y="138" text-anchor="middle">hypothesis and intent</text>
  <text class="symbol" x="158" y="155" text-anchor="middle">H(t)</text>

  <rect class="interface" x="316" y="84" width="236" height="76" rx="5"/>
  <text class="node-title" x="434" y="114" text-anchor="middle">GDB/AI</text>
  <text class="node-note" x="434" y="138" text-anchor="middle">bounded semantic operation</text>
  <text class="symbol" x="434" y="155" text-anchor="middle">O(t)</text>

  <rect class="node" x="600" y="84" width="220" height="76" rx="5"/>
  <text class="node-title" x="710" y="114" text-anchor="middle">GNU GDB</text>
  <text class="node-note" x="710" y="138" text-anchor="middle">target execution and state</text>
  <text class="symbol" x="710" y="155" text-anchor="middle">S(t)</text>

  <rect class="node" x="868" y="84" width="204" height="76" rx="5"/>
  <text class="node-title" x="970" y="114" text-anchor="middle">Evidence</text>
  <text class="node-note" x="970" y="138" text-anchor="middle">context · completeness</text>
  <text class="symbol" x="970" y="155" text-anchor="middle">E(t)</text>

  <path class="flow" d="M268 122 H316"/>
  <path class="flow" d="M552 122 H600"/>
  <path class="flow" d="M820 122 H868"/>

  <path class="return" d="M970 160 V207 H158 V160"/>
  <rect x="443" y="190" width="242" height="32" rx="16" fill="#fbfaf7"/>
  <text class="node-note" x="564" y="211" text-anchor="middle">evidence informs the next turn</text>

  <text class="node-note" x="434" y="257" text-anchor="middle">MCP · canonical JSON-RPC</text>
  <text class="node-note" x="710" y="257" text-anchor="middle">GDB/MI 3 or 4</text>
</svg>
