name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GDB_AI_REQUIRE_INTEGRATION: "1"
    steps:
      # 2026-08-29: Release qualification must not execute mutable action refs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
          components: clippy,rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install debugger prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bubblewrap gcc gcc-aarch64-linux-gnu gdb gdb-multiarch \
            gdbserver qemu-user
      - name: Verify debugger prerequisites
        run: |
          gdb --version
          gdbserver --version
          gcc --version
          output=$(printf '1-gdb-exit\n' | gdb -q -nx --interpreter=mi4)
          grep -q '1\^exit' <<<"$output"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        run: cargo test --locked --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Verify schemas
        run: cd schemas && sha256sum -c SHA256SUMS
      - name: Verify Python sources
        run: |
          python3 -m compileall -q gdb-extension sdk/python benchmarks/python
          PYTHONPATH=sdk/python/src python3 -m unittest discover -s sdk/python/tests
      - name: Build TypeScript SDK
        run: |
          npm --prefix sdk/typescript ci
          npm --prefix sdk/typescript run build
          node sdk/typescript/test.mjs
      - name: Install fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-08-01 --profile minimal
          # 2026-08-29: Build cargo-fuzz with the pinned nightly because its
          # locked cargo-platform dependency requires newer Rust than MSRV.
          cargo +nightly-2026-08-01 install cargo-fuzz \
            --version 0.13.2 --locked
      - name: Run fuzz campaigns
        run: |
          mkdir -p "$RUNNER_TEMP/mi-corpus" "$RUNNER_TEMP/reducer-corpus"
          cp tests/mi-fixtures/*.mi "$RUNNER_TEMP/mi-corpus/"
          cp fuzz/corpus/state_reducer/*.json "$RUNNER_TEMP/reducer-corpus/"
          for target in mi_parser mi_framer state_reducer; do
            corpus="$RUNNER_TEMP/mi-corpus"
            if [ "$target" = state_reducer ]; then
              corpus="$RUNNER_TEMP/reducer-corpus"
            fi
            log="$RUNNER_TEMP/$target.log"
            if cargo +nightly-2026-08-01 fuzz run "$target" "$corpus" -- \
              -max_total_time=60 -max_len=65536 -timeout=5 \
              -rss_limit_mb=1536 -verbosity=0 -print_final_stats=1 \
              >"$log" 2>&1; then
              tail -n 8 "$log"
            else
              cat "$log"
              exit 1
            fi
          done

  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        series: ["6.1", "6.12", "6.12-arm64"]
    env:
      GDB_AI_REQUIRE_INTEGRATION: "1"
      GDB_AI_REQUIRE_KERNEL_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
      - name: Install kernel debugger prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            busybox-static cpio curl gdb gdb-multiarch \
            qemu-system-arm qemu-system-x86 xz-utils
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/gdb-ai-kernel/downloads
          key: debian-kernel-${{ matrix.series }}-2026-08-28
      - name: Fetch pinned Debian kernel artifacts
        run: tests/kernel/fetch-debian-kernel.sh "${{ runner.temp }}/gdb-ai-kernel" "${{ matrix.series }}" >> "$GITHUB_ENV"
      - name: Verify Linux kernel provider
        run: cargo test --locked -p gdb-ai-core --test kernel -- --nocapture

  aarch64-system:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
      - name: Install AArch64 system-test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            e2fsprogs gcc-aarch64-linux-gnu qemu-system-arm qemu-user-static
          # 2026-08-29: qemu-user-static installs a systemd-binfmt rule, not
          # an update-binfmts entry, so reload the native registration path.
          sudo systemctl restart systemd-binfmt.service
          test -r /proc/sys/fs/binfmt_misc/qemu-aarch64
      - name: Verify AArch64 container emulation
        run: |
          architecture=$(docker run --rm --platform linux/arm64 \
            debian:trixie-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132 \
            uname -m)
          test "$architecture" = aarch64
      - name: Verify native AArch64 launch, attach, core, and gdbserver
        run: tests/aarch64/run-system.sh "$RUNNER_TEMP/aarch64-system"

  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "9.2"
            expected_mi: mi3
            sha256: 360cd7ae79b776988e89d8f9a01c985d0b1fa21c767a4295e5f88cb49175c555
            image: ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
          - version: "10.2"
            expected_mi: mi3
            sha256: aaa1223d534c9b700a8bec952d9748ee1977513f178727e1bee520ee000b4f29
            image: ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
          - version: "11.2"
            expected_mi: mi3
            sha256: 1497c36a71881b8671a9a84a0ee40faab788ca30d7ba19d8463c3cc787152e32
            image: ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
          - version: "12.1"
            expected_mi: mi3
            sha256: 0e1793bf8f2b54d53f46dea84ccfd446f48f81b297b28c4f7fc017b818d69fed
            image: ubuntu:22.04@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc
          - version: "13.2"
            expected_mi: mi4
            sha256: fd5bebb7be1833abdb6e023c2f498a354498281df9d05523d8915babeb893f0a
            image: ubuntu:22.04@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc
          - version: "14.2"
            expected_mi: mi4
            sha256: 2d4dd8061d8ded12b6c63f55e45344881e8226105f4d2a9b234040efa5ce7772
            image: ubuntu:22.04@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc
          - version: "15.2"
            expected_mi: mi4
            sha256: 83350ccd35b5b5a0cba6b334c41294ea968158c573940904f00b92f76345314d
            image: ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
          - version: "16.3"
            expected_mi: mi4
            sha256: bcfcd095528a987917acf9fff3f1672181694926cc18d609c99d0042c00224c5
            image: ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
          - version: "17.2"
            expected_mi: mi4
            sha256: 1c036c0d72e4b3d1fb5c94c88632add6f9d76f4d7c4d2ea793c12a9f19a3228c
            image: ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
    env:
      GDB_AI_REQUIRE_INTEGRATION: "1"
      GDB_AI_EXPECTED_MI: ${{ matrix.expected_mi }}
      # 2026-09-04: Container jobs run as root, but GitHub supplied a
      # /github/home HOME that rustup rejected. Keep its homes consistent with
      # the effective user so every compatibility image bootstraps identically.
      HOME: /root
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
    steps:
      - name: Install compatibility prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bison build-essential ca-certificates curl flex git \
            libexpat1-dev libgmp-dev libmpfr-dev libreadline-dev \
            texinfo xz-utils zstd
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # 2026-09-04: rustup bootstrap downloads intermittently failed before
      # the action's retry policy could recover. One action-level retry keeps
      # an external transfer blip from discarding an otherwise valid matrix.
      - id: compatibility-toolchain
        continue-on-error: true
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
      - if: steps.compatibility-toolchain.outcome == 'failure'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/gdb/${{ matrix.version }}
          key: gdb-${{ matrix.version }}-${{ matrix.sha256 }}-${{ matrix.image }}
      - name: Build GNU GDB ${{ matrix.version }}
        run: |
          tests/compatibility/build-gdb.sh \
            "${{ matrix.version }}" \
            "${{ matrix.sha256 }}" \
            "$RUNNER_TEMP/gdb/${{ matrix.version }}"
          "$RUNNER_TEMP/gdb/${{ matrix.version }}/bin/gdb" --version | head -n 1
      - name: Verify GDB/AI vertical slice
        run: |
          # 2026-08-29: The runner context is unavailable in job-level env;
          # bind the qualified binary here so workflow validation can start.
          GDB_AI_GDB_PATH="$RUNNER_TEMP/gdb/${{ matrix.version }}/bin/gdb" \
            cargo test --locked -p gdb-ai-core --test vertical \
            local_debugging_vertical_slice -- --exact --nocapture

  soak:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GDB_AI_REQUIRE_INTEGRATION: "1"
      GDB_AI_SOAK_CYCLES: "10000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
      - name: Install lifecycle prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gdb
      - name: Run 10,000 real GDB lifecycles
        run: |
          cargo test --locked -p gdb-ai-core --test soak \
            ten_thousand_session_lifecycles -- \
            --exact --ignored --nocapture --test-threads=1

  release-bundle:
    if: startsWith(github.ref, 'refs/tags/v')
    # 2026-08-29: Keep the long soak as release evidence without making
    # otherwise-qualified binary packaging wait for it.
    needs: [verify, kernel, aarch64-system, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
          targets: x86_64-unknown-linux-musl
      - name: Install release linker
        run: |
          sudo apt-get update
          sudo apt-get install -y file musl-tools
      - name: Verify release tag and build identity
        run: |
          # 2026-08-29: checkout flattens the local tag ref to GITHUB_SHA;
          # verify the fetched remote tag object and its target instead.
          tag_object=$(git ls-remote --exit-code origin "$GITHUB_REF" | \
            awk 'NR == 1 { print $1 }')
          test "$(git cat-file -t "$tag_object")" = tag
          test "$(git rev-parse "${tag_object}^{}")" = "$GITHUB_SHA"
          source_date_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"
          # 2026-08-29: GNU builds inherited the runner's glibc requirement;
          # publish a static musl binary so older Linux hosts can start it.
          GDB_AI_BUILD_COMMIT="$GITHUB_SHA" \
          GDB_AI_BUILD_TAG="$GITHUB_REF_NAME" \
          GDB_AI_BUILD_DIRTY=false \
            cargo build --locked --release -p gdb-ai \
              --target x86_64-unknown-linux-musl
          binary=target/x86_64-unknown-linux-musl/release/gdb-ai
          file "$binary" | tee "$RUNNER_TEMP/file.txt"
          ! readelf -l "$binary" | grep -q 'Requesting program interpreter'
          "$binary" --version | tee "$RUNNER_TEMP/version.txt"
          grep -F "tag: $GITHUB_REF_NAME" "$RUNNER_TEMP/version.txt"
          grep -F "commit: $GITHUB_SHA" "$RUNNER_TEMP/version.txt"
          grep -F "dirty: false" "$RUNNER_TEMP/version.txt"
      - name: Generate deterministic archives and SBOM
        run: |
          version=${GITHUB_REF_NAME#v}
          release="$RUNNER_TEMP/release"
          bundle="$RUNNER_TEMP/gdb-ai-$version-x86_64-unknown-linux-musl"
          mkdir -p "$release" "$bundle"
          install -m755 \
            target/x86_64-unknown-linux-musl/release/gdb-ai \
            "$bundle/gdb-ai"
          # 2026-08-29: Omit README from binary bundles because its
          # repository-relative assets exist only in the source archive.
          install -m644 LICENSE gdb-ai.example.toml "$bundle/"
          cp -R schemas "$bundle/schemas"
          git archive --format=tar --prefix="gdb-ai-$version/" \
            "$GITHUB_SHA" > "$release/gdb-ai-$version-source.tar"
          gzip -n "$release/gdb-ai-$version-source.tar"
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" \
            --owner=0 --group=0 --numeric-owner \
            -C "$RUNNER_TEMP" \
            -cf "$release/gdb-ai-$version-x86_64-unknown-linux-musl.tar" \
            "gdb-ai-$version-x86_64-unknown-linux-musl"
          gzip -n "$release/gdb-ai-$version-x86_64-unknown-linux-musl.tar"
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          # 2026-08-29: cargo-cyclonedx rejects override-filename when
          # describe selects binary components. Normalize the output below.
          cargo cyclonedx --format json --spec-version 1.5 \
            --describe binaries --manifest-path crates/gdb-ai/Cargo.toml
          sbom=$(find crates/gdb-ai -maxdepth 1 -name 'gdb-ai*.cdx.json' \
            -print -quit)
          test -n "$sbom"
          cp "$sbom" "$release/gdb-ai-$version.cdx.json"
          cd "$release"
          sha256sum *.tar.gz *.cdx.json > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: ${{ runner.temp }}/release/*
      - name: Upload qualified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gdb-ai-${{ github.ref_name }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
